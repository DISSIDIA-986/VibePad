<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VibePad</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      background: #0b1020;
      overflow: hidden;
      cursor: none;
      user-select: none;
    }
    .deck { height: 100%; width: 100%; position: relative; }
    .slide {
      position: absolute;
      inset: 0;
      display: none;
      background: #0b1020;
    }
    .slide.active { display: block; }
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
  </style>
</head>
<body>
  <main class="deck" id="deck">
    <!-- ~3 min: hook → dual-screen → controls → loop → overview -->
    <section class="slide active" data-slide>
      <img src="assets/vibepad-hero-couch.png" alt="" />
    </section>
    <section class="slide" data-slide>
      <img src="assets/vibepad-learn-build-couch.png" alt="" />
    </section>
    <section class="slide" data-slide>
      <img src="assets/vibepad-controls-closeup.png" alt="" />
    </section>
    <section class="slide" data-slide>
      <img src="assets/vibepad-workflow-3step.png" alt="" />
    </section>
    <section class="slide" data-slide>
      <img src="assets/vibepad-use-cases-features.png" alt="" />
    </section>
  </main>

  <script>
    const slides = [...document.querySelectorAll("[data-slide]")];
    let i = 0;

    function show(n) {
      i = Math.max(0, Math.min(slides.length - 1, n));
      slides.forEach((s, idx) => s.classList.toggle("active", idx === i));
      history.replaceState(null, "", `#${i + 1}`);
      document.title = `VibePad ${i + 1}/${slides.length}`;
    }

    window.addEventListener("keydown", (e) => {
      if (["ArrowRight", "ArrowDown", " ", "PageDown", "Enter"].includes(e.key)) {
        e.preventDefault();
        show(i + 1);
      } else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) {
        e.preventDefault();
        show(i - 1);
      } else if (e.key === "Home") show(0);
      else if (e.key === "End") show(slides.length - 1);
      else if (e.key.toLowerCase() === "f") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      }
    });

    document.addEventListener("click", (e) => {
      if (e.clientX / window.innerWidth >= 0.5) show(i + 1);
      else show(i - 1);
    });

    const hash = parseInt(location.hash.slice(1), 10);
    show(Number.isFinite(hash) && hash > 0 ? hash - 1 : 0);
  </script>
</body>
</html>
